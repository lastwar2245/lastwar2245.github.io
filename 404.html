<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#15110d">
<title>404 · LastWar2245</title>
<style>
:root{color-scheme:dark;--bg:#100d0a;--panel:#1b1611;--line:#6f4a25;--gold:#f5c466;--text:#f6efe7;--muted:#c8b9aa}
*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0,#38200f 0,#17100b 38%,#0c0a08 100%);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
.card{width:min(680px,100%);padding:clamp(24px,5vw,46px);border:1px solid var(--line);border-radius:24px;background:linear-gradient(180deg,rgba(32,24,17,.97),rgba(20,16,12,.97));box-shadow:0 24px 70px rgba(0,0,0,.45);text-align:center}.mark{font-size:clamp(42px,10vw,74px);line-height:1;margin-bottom:10px}.code{font-size:.82rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:800}.title{margin:.45rem 0 .65rem;font-size:clamp(1.6rem,5vw,2.55rem)}.text{margin:0 auto 1.55rem;max-width:50ch;color:var(--muted);line-height:1.65}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:.72rem 1rem;border-radius:12px;border:1px solid #8a5d2c;text-decoration:none;font-weight:750;color:#1a1209;background:var(--gold)}.btn.secondary{color:var(--text);background:#241a12}.foot{margin-top:1.5rem;font-size:.82rem;color:#9e8c7b}
</style>
</head>
<body>
<main class="card" role="main">
<div class="mark" aria-hidden="true">🪓🔥</div>
<div class="code">404 · LastWar2245</div>
<h1 class="title" id="t">Page introuvable</h1>
<p class="text" id="m">Cette piste se perd dans la forêt. Aucun plan du site ni chemin interne n’est affiché ici.</p>
<div class="actions">
<a class="btn" id="home" href="/">🏠 <span id="homeText">Retour à l’accueil</span></a>
<a class="btn secondary" id="guide" href="/#guide">⚔️ <span id="guideText">Guide VS</span></a>
</div>
<div class="foot">[LaB] LegioArdensBûcheria · Serveur 2245</div>
</main>
<script>
(()=>{const S=['fr','it','en','uk','de','es','pt'];const q=new URLSearchParams(location.search).get('lang');const nav=(navigator.language||'fr').toLowerCase().split('-')[0];const l=S.includes(q)?q:(S.includes(nav)?nav:'fr');const T={
fr:['Page introuvable','Cette piste se perd dans la forêt. Revenez au camp pour reprendre le bon chemin.','Retour à l’accueil','Guide VS'],
it:['Pagina non trovata','Questo sentiero si perde nella foresta. Torna al campo per riprendere la strada giusta.','Torna alla home','Guida VS'],
en:['Page not found','This trail disappears into the forest. Return to camp and pick up the right path.','Back to home','VS Guide'],
uk:['Сторінку не знайдено','Ця стежка губиться в лісі. Поверніться до табору, щоб знайти правильний шлях.','На головну','Гайд VS'],
de:['Seite nicht gefunden','Dieser Pfad verliert sich im Wald. Kehre zum Lager zurück und nimm den richtigen Weg.','Zur Startseite','VS-Leitfaden'],
es:['Página no encontrada','Este sendero se pierde en el bosque. Vuelve al campamento para retomar el camino correcto.','Volver al inicio','Guía VS'],
pt:['Página não encontrada','Este caminho perde-se na floresta. Volte ao acampamento para retomar o caminho certo.','Voltar ao início','Guia VS']};
const x=T[l];document.documentElement.lang=l;document.getElementById('t').textContent=x[0];document.getElementById('m').textContent=x[1];document.getElementById('homeText').textContent=x[2];document.getElementById('guideText').textContent=x[3];const suffix='?lang='+encodeURIComponent(l);document.getElementById('home').href='/'+suffix;document.getElementById('guide').href='/'+suffix+'#guide';})();
</script>
</body>
</html>
